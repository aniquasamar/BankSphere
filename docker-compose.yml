name: banksphere

services:
  mongo:
    image: mongo:7
    # MongoDB transactions need a replica set, so run a single-node one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # First probe initiates the replica set; later probes pass once the node is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    ports:
      # Host port 27018 so it never clashes with a local MongoDB on 27017.
      # Compass: mongodb://localhost:27018/?directConnection=true
      - "127.0.0.1:27018:27017"

  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: mongodb://mongo:27017/banksphere?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_EMAIL_PASSWORD: ${ADMIN_EMAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time (Vite).
        VITE_BASEURL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
  uploads: