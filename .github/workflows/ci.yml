name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-22.04 # pinned: mongodb-memory-server downloads a matching mongod build
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The tests start a throw-away in-memory MongoDB replica set; cache its binary.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Run tests with coverage
        run: npx jest --runInBand --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # informational for now

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # TODO: remove once `npm run lint` passes locally

      - name: Build
        run: npm run build
        env:
          VITE_BASEURL: http://localhost:8080

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: API is healthy
        run: curl -fsS http://localhost:8080/health

      - name: Frontend is served
        run: curl -fsS http://localhost:5173/ | grep -q '<div id="root">'

      - name: Seed demo data and log in as admin
        run: |
          docker compose exec -T backend node scripts/seed.js
          curl -fsS -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@bank.test","password":"admin123"}' | grep -q '"isLogged":true'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v